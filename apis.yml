description: >-
  TestFairy is a mobile app testing and distribution platform, now part of Sauce
  Labs, that lets teams upload iOS and Android builds, distribute them to beta
  testers, and record video sessions of testers using the app alongside device
  logs, crash reports, and CPU/memory/network telemetry for debugging. It exposes
  a REST API for managing projects, builds, testers, tester groups, sites,
  webhooks, and audit trails, plus a separate Upload API for pushing APK/AAB/IPA
  packages and symbol files from CI. Native SDKs (iOS, Android) and cross-platform
  wrappers (React Native, Flutter, Cordova, Unity, Xamarin, NativeScript) instrument
  apps, and command-line uploaders integrate with Jenkins, fastlane, Travis, and
  CircleCI. Authentication is HTTP Basic (email + API key) or OIDC bearer tokens.
